# main에 올릴 때마다 데스크톱 앱(녹화방송) 설치 파일을 만들어 GitHub Release `app-latest`에 덮어 올린다.
# 다운로드 주소는 늘 같다: https://github.com/<저장소>/releases/download/app-latest/<파일 이름>
# 맥 서명·공증에 쓰는 Secrets와 만드는 법은 docs/desktop-release.md에 있다.
name: 앱 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 Release를 두 실행이 동시에 덮어쓰지 않게 한다. 도는 중인 실행은 끊지 않고(올리다 만 Release를 남기지 않게),
# 새 푸시는 그 뒤에 기다린다.
concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CI와 같은 검사·테스트. 하나라도 실패하면 앱을 묶지도 올리지도 않는다.
  ci:
    uses: ./.github/workflows/ci.yml

  bundle:
    needs: ci
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: msi
            asset: chzzk-windows-x64.msi
          - os: macos-15
            kind: dmg
            asset: chzzk-macos-arm64.dmg
          - os: macos-15-intel
            kind: dmg
            asset: chzzk-macos-x64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 앱이 부를 배포 서버(src/app/screens.rs).
      CHZZK_APP_SERVER_URL: https://chzzk.haroobuzii.com
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml에 적힌 버전을 그대로 설치한다.
      - name: Rust 설치
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.asset }}

      # dx는 미리 빌드된 파일을 받는다. 버전은 Cargo.toml의 dioxus와 맞춘다.
      # cargo-binstall은 커밋 SHA(v1.26.2)로 고정하고, 받는 바이너리 버전도 같게 맞춘다.
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
        with:
          version: 1.26.2
      - name: dx 설치
        run: cargo binstall dioxus-cli@0.7.10 -y --force

      # 맥 Secrets가 모두 있으면 서명·공증하고, 없으면 ad-hoc 서명만 하고 알림을 남긴다(스크립트 안에서 판단).
      - name: 앱 묶기
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/bundle-app.sh "${{ matrix.kind }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # 세 파일이 모두 만들어졌을 때만 Release를 바꾼다. 하나라도 실패하면 이전 파일이 그대로 남는다.
  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release app-latest에 올리기
        run: |
          ls -la dist
          notes="main 커밋 ${GITHUB_SHA} 에서 만든 데스크톱 앱(녹화방송)이다. 설치와 첫 실행 경고는 다운로드 페이지를 본다."
          if gh release view app-latest >/dev/null 2>&1; then
            # 태그를 이번 커밋으로 옮기고 설명을 바꾼다.
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/app-latest" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit app-latest --notes "$notes"
          else
            gh release create app-latest --target "${GITHUB_SHA}" --title "녹화방송 앱 (최신)" --notes "$notes" --latest
          fi
          gh release upload app-latest \
            dist/chzzk-windows-x64.msi dist/chzzk-macos-arm64.dmg dist/chzzk-macos-x64.dmg --clobber
