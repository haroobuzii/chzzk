# main에 올릴 때마다 검사·테스트가 통과하면 서버 이미지를 만들어 GHCR에 올리고 배포 서버를 새 버전으로 바꾼다.
# 흐름과 Secrets 만드는 법은 docs/deploy.md에 있다. 결정 배경은 ADR 0008이다.
name: 서버 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나만 돈다. 도는 중인 배포는 끊지 않고, 새 푸시는 그 뒤에 기다린다.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/haroobuzii/chzzk

jobs:
  # CI와 같은 검사·테스트. 하나라도 실패하면 아래 단계는 돌지 않는다.
  # 손으로 돌릴 때(workflow_dispatch)도 main에서만 배포한다. 다른 브랜치를 고르면 아무것도 하지 않는다.
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    # 배포 서버(OCI A1)와 같은 ARM64에서 바로 빌드한다(에뮬레이션 없음).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 이미지 태그이자 /healthz의 version. 7자리 짧은 커밋 해시다.
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: CHZZK_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 전용 SSH 키와 서버의 호스트 키를 러너에 둔다. 값은 로그에 나오지 않는다.
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버를 새 이미지로 바꾸고 /healthz 확인
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.image.outputs.tag }}
        run: scripts/deploy-server.sh "$TAG"
