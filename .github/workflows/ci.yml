# 올릴 때마다 코드 모양, 서버용·화면용 빌드, DB 테스트를 자동으로 확인한다.
# 로컬에서 같은 검사를 하려면 README의 "테스트" 절을 본다.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # 테스트용 PostgreSQL. docker-compose.yml과 같은 개발용 값이며 비밀 값이 아니다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chzzk
          POSTGRES_PASSWORD: chzzk
          POSTGRES_DB: chzzk
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://chzzk:chzzk@localhost:5433/chzzk
      # 경고도 실패로 본다.
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 코드 모양
        run: cargo fmt --check

      - name: 화면용(web) 빌드 검사
        run: cargo check

      - name: 서버용(server) 빌드 검사
        run: cargo check --no-default-features --features server

      - name: 테스트
        run: cargo test --no-default-features --features server
