# 올릴 때마다 코드 모양, 서버용·화면용 빌드, DB 테스트를 자동으로 확인한다.
# 로컬에서 같은 검사를 하려면 README의 "테스트" 절을 본다.
name: CI

on:
  push:
  pull_request:
  # 서버 배포(deploy.yml)가 배포 전에 같은 검사를 부른다.
  workflow_call:

permissions:
  contents: read

jobs:
  # 워크플로·셸 스크립트·운영용 compose 파일의 문법을 본다. 빌드가 필요 없어 금방 끝난다.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 워크플로 안의 run: 셸도 러너에 깔린 shellcheck로 함께 본다.
      - name: 워크플로 검사(actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: 셸 스크립트 검사(shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # 서버에서 쓰는 compose 파일이 해석되는지 본다. 값은 .env.example의 자리표시자다.
      - name: 운영용 compose 검사
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.example config -q

  check:
    runs-on: ubuntu-latest

    # 테스트용 PostgreSQL. docker-compose.yml과 같은 개발용 값이며 비밀 값이 아니다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chzzk
          POSTGRES_PASSWORD: chzzk
          POSTGRES_DB: chzzk
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://chzzk:chzzk@localhost:5433/chzzk
      # 경고도 실패로 본다.
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v4
        with:
          # 비밀 키 검사가 모든 커밋 기록을 보도록 전체 기록을 받는다.
          fetch-depth: 0

      # 토스 키 모양(test_/live_ + ck/sk)이 커밋되면 실패한다. 테스트용 _fake 값과 자리표시자는 뺀다.
      - name: 비밀 키 검사
        run: scripts/check-secrets.sh --patterns-only

      # rust-toolchain.toml에 적힌 버전을 그대로 설치한다. 버전은 그 파일 한 곳에서만 정한다.
      - name: Rust 설치
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: 코드 모양
        run: cargo fmt --check

      - name: 화면용(web) 빌드 검사
        run: cargo check

      - name: 서버용(server) 빌드 검사
        run: cargo check --no-default-features --features server

      # 데스크톱 앱은 리눅스에서 WebKitGTK로 빌드된다. 검사에 필요한 개발 라이브러리를 깐다.
      - name: 앱 빌드용 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 데스크톱 앱(app) 빌드 검사
        run: cargo check --no-default-features --features app

      # 앱의 서버 연결 모듈 테스트도 이 서버 테스트 실행에 함께 들어간다(src/app/mod.rs).
      - name: 테스트
        run: cargo test --no-default-features --features server 2>&1 | tee test-output.txt

      # README에 적은 최신 테스트 개수가 실제 통과 개수와 같은지 본다.
      - name: README 테스트 개수
        run: scripts/check-readme-test-count.sh test-output.txt
