[package]
name = "chzzk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", default-features = false, features = ["multipart"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
dotenvy = { version = "0.15", optional = true }
hex = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"], optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "time", "net", "rt"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
# 데스크톱 앱(녹화방송): 서버 기능 없이 배포 서버의 공개 API만 부르는 보기 전용 앱이다(ADR 0009).
app = ["dioxus/desktop", "dep:reqwest"]
server = ["dioxus/server", "dep:sqlx", "dep:anyhow", "dep:dotenvy", "dep:axum", "dep:tempfile", "dep:tokio", "dep:tower", "dep:tower-http", "dep:hex", "dep:log", "dep:rand", "dep:reqwest", "dep:sha2", "dep:argon2"]

# 비밀번호 해시(Argon2)는 최적화하지 않으면 한 번에 1초 넘게 걸려 테스트가 느려진다. 이 둘만 개발 빌드에서도 최적화한다.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# dx bundle --release가 쓰는 프로필. dx는 없으면 스스로 만들지만, Dockerfile의 cargo chef cook이
# 같은 프로필로 의존성을 미리 빌드하려면 여기 있어야 한다. 값은 dx 0.7.10이 스스로 만드는 프로필과 같게 맞췄다
# (strip 끔, WASM은 크기 우선 opt-level "s"). 하나라도 다르면 dx가 의존성을 처음부터 다시 빌드한다.
[profile.server-release]
inherits = "release"
strip = false

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = false
