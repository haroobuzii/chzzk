[package]
name = "chzzk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", default-features = false, features = ["multipart"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dioxus = { version = "0.7.10", features = ["router"] }
dotenvy = { version = "0.15", optional = true }
hex = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"], optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "time", "net", "rt"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
default = ["web"]
# fullstack은 dioxus 의존성에 두지 않고 web·server 기능에서만 켠다.
# dx는 dioxus 의존성이나 고른 기능에 "dioxus/fullstack"이 바로 적혀 있으면 서버도 함께 빌드한다.
# 그래서 web(`dx serve`, `dx bundle --web`)은 지금처럼 서버까지 빌드하고, app 번들은 앱만 빌드한다.
web = ["dioxus/web", "dioxus/fullstack"]
# 데스크톱 앱(녹화방송): 서버 기능 없이 배포 서버의 공개 API만 부르는 보기 전용 앱이다(ADR 0009).
# 공유 화면 코드가 서버 함수 타입을 쓰므로 fullstack은 켜 두되, app-fullstack을 거쳐 켜서
# `dx bundle --desktop --features app`이 서버를 따로 빌드하지 않게 한다(docs/desktop-release.md).
app = ["dioxus/desktop", "app-fullstack", "dep:reqwest"]
app-fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack", "dep:sqlx", "dep:anyhow", "dep:dotenvy", "dep:axum", "dep:tempfile", "dep:tokio", "dep:tower", "dep:tower-http", "dep:hex", "dep:log", "dep:rand", "dep:reqwest", "dep:sha2", "dep:argon2"]

# 비밀번호 해시(Argon2)는 최적화하지 않으면 한 번에 1초 넘게 걸려 테스트가 느려진다. 이 둘만 개발 빌드에서도 최적화한다.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
